spring:
  profiles:
    default: testnet

bitcoin:
  node:
    auto-start: true

  p2p:
    listen: true
    max-inbound-peers: 32
    target-outbound-peers: 8
    target-block-relay-peers: 2
    v2-transport: true

  rpc:
    bind: 127.0.0.1
    enabled: true
    user: bitcoin
    password: bitcoin

  mining:
    payout-script: "51"
