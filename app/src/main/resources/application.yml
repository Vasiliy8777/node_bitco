spring:
  profiles:
    default: testnet

bitcoin:
  # Root for all persistent node data. Each network gets its own subdirectory.
  data-directory: "K:/BitcoinJavaNode"

  node:
    auto-start: true

  p2p:
    listen: true
    max-inbound-peers: 32
    target-outbound-peers: 8
    target-block-relay-peers: 2
    v2-transport: true

  rpc:
    bind: 127.0.0.1
    enabled: true
    user: bitcoin
    password: bitcoin

  mining:
    # Preferred: native SegWit address (bc1..., tb1..., bcrt1...). It is network-validated.
    payout-address: ${BITCOIN_MINING_PAYOUT_ADDRESS:}
    # Legacy/raw scriptPubKey fallback. payout-address takes precedence when configured.
    payout-script: "51"
