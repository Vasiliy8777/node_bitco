bitcoin:
  network: mainnet
  # Native cache is outside the 4 GiB Java heap; override for smaller hosts.
  rocksdb-block-cache-mib: ${BITCOIN_ROCKSDB_BLOCK_CACHE_MIB:2048}
  # On the current HDD, speculative look-ahead competes with validation reads.
  ibd-utxo-prefetch: ${BITCOIN_IBD_UTXO_PREFETCH:false}
  data-directory: ${BITCOIN_DATA_DIRECTORY:K:/BitcoinJavaNode}

  p2p:
    port: 8333
    peers: ""

  rpc:
    port: 8332
logging:
  file:
    name: ${BITCOIN_LOG_FILE:target/mainnet-node.log}
