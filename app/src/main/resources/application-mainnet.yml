bitcoin:
  network: mainnet
  # Native cache is outside the Java heap; override for smaller hosts.
  rocksdb-block-cache-mib: ${BITCOIN_ROCKSDB_BLOCK_CACHE_MIB:4096}
  # Java coin objects share the heap with validation and downloaded blocks.
  utxo-read-cache-entries: ${BITCOIN_UTXO_READ_CACHE_ENTRIES:1000000}
  # Keep prefetch opt-in; tune it for the volume holding chainstate.
  ibd-utxo-prefetch: ${BITCOIN_IBD_UTXO_PREFETCH:false}
  data-directory: ${BITCOIN_DATA_DIRECTORY:K:/BitcoinJavaNode}
  # Optional separate root for <network>/chainstate; block/undo files stay in data-directory.
  chainstate-directory: ${BITCOIN_CHAINSTATE_DIRECTORY:}

  p2p:
    port: 8333
    peers: ""

  rpc:
    port: 8332
logging:
  file:
    name: ${BITCOIN_LOG_FILE:target/mainnet-node.log}
