spring:
  application:
    name: ravencoin-node
  main:
    web-application-type: none
ravencoin:
  network: ${RVN_NETWORK:mainnet}
  data-directory: '${RVN_DATA_DIRECTORY:K:/RVNJavaNjde}'
  storage:
    hot-directory: '${RVN_HOT_DIRECTORY:C:/RVNJavaNjde}'
  sync:
    enabled: ${RVN_SYNC_ENABLED:false}
    blocks-enabled: ${RVN_SYNC_BLOCKS:false}
    # Discover verified headers to a recent peer tip before downloading new bodies.
    headers-first: ${RVN_SYNC_HEADERS_FIRST:true}
    # Independent CPU light verifiers, each retaining one epoch cache; 1..8.
    pow-workers: ${RVN_SYNC_POW_WORKERS:4}
    # Share the mining GPU context; starts only after mandatory CUDA self-tests.
    gpu-pow-enabled: ${RVN_SYNC_GPU_POW:${ravencoin.mining.cuda.enabled:false}}
    # IPv6 bootstrap handshake/getheaders checked 2026-10-28, from RavenProject's
    # src/chainparamsseeds.h. DNS seeds may currently return only IPv4 addresses.
    # Peer discovery is untrusted: every header/body is independently checked.
    peers: ${RVN_SYNC_PEERS:2602:ffb8::208:72:56:214,51.79.161.39,79.137.67.110,5.196.79.95,seed-raven.bitactivate.com,seed-raven.ravencoin.com,seed-raven.ravencoin.org}
    response-timeout-ms: 30000
    poll-ms: ${RVN_SYNC_POLL_MS:2000}
    # Prefer body download/replay when verified headers already lead by this much.
    header-lead-blocks: ${RVN_SYNC_HEADER_LEAD_BLOCKS:4096}
    # Always request more headers after at most this many body batches.
    body-batches-per-header: ${RVN_SYNC_BODY_BATCHES_PER_HEADER:4}
    # Rotate after two slow body batches, excluding local checks/writes.
    # At least 5 s transport allowance per batch; 0 disables slow-peer rotation.
    minimum-peer-kib-per-second: ${RVN_SYNC_MINIMUM_PEER_KIB_PER_SECOND:64}
    # The receive queue keeps its 32 MiB bound; budget failures reduce this window.
    block-in-flight: ${RVN_SYNC_BLOCK_IN_FLIGHT:32}
    # Native RocksDB cache, outside -Xmx. Does not change durability.
    coin-cache-mib: ${RVN_SYNC_COIN_CACHE_MIB:1024}
    # Fallback for broken system DNS; only peer addresses, never trusted chain data.
    # An empty RVN_SYNC_DOH disables HTTPS DNS.
    dns-over-https: '${RVN_SYNC_DOH:https://dns.google/resolve}'
  mining:
    # Starts a waiting mining service after CUDA self-tests. Work additionally
    # requires complete historical validation, current chainstate and a live peer.
    # Existing unversioned state is revalidated from genesis; enabling this cannot
    # bypass initial block download or authorize work on a header-only tip.
    enabled: ${RVN_MINING_ENABLED:false}
    address: ${RVN_MINING_ADDRESS:}
    # Amortize Java/Python/CUDA overhead; at most 65536 nonce per call.
    batch-size: ${RVN_MINING_BATCH_SIZE:65536}
    cuda:
      # Enables the worker and real GPU Core-vector tests. Live work additionally
      # requires mining.enabled and every validation/readiness gate.
      enabled: ${RVN_CUDA_ENABLED:false}
      # Local easy-target block diagnostic; no network submission or mainnet reward.
      job-self-test-enabled: ${RVN_CUDA_JOB_SELF_TEST:false}
      python: ${RVN_CUDA_PYTHON:python}
      worker: '${RVN_CUDA_WORKER:rvn-pow/native/cuda/worker.py}'
      device: ${RVN_CUDA_DEVICE:0}
      reserve-mib: ${RVN_CUDA_RESERVE_MIB:1024}
  validation:
    # Historical native-coin replay only; stops before asset activation.
    # Historical asset replay adds qualifier/restricted rules and atomic undo.
    # The parent qualifier snapshot is durable at every block boundary.
    native-replay-enabled: ${RVN_NATIVE_REPLAY:false}
    # Requires native replay, header sync and body downloads. Mining additionally
    # requires contiguous versioned validation from genesis and a current tip.
    canonical-asset-replay-enabled: ${RVN_CANONICAL_ASSET_REPLAY:false}
  pow:
    self-test-enabled: ${RVN_POW_SELF_TEST:false}
    # 16 MiB of DAG payload per CPU verifier, plus map overhead and light-cache.
    cached-dag-items: ${RVN_CACHED_DAG_ITEMS:65536}
  p2p:
    probe-enabled: ${RVN_P2P_PROBE:false}
    host: ${RVN_P2P_HOST:127.0.0.1}
    port: ${RVN_P2P_PORT:0}
    timeout-ms: 5000
    session-enabled: ${RVN_P2P_SESSION:false}
    session-duration-ms: ${RVN_P2P_SESSION_DURATION_MS:5000}
    queue-capacity: ${RVN_P2P_QUEUE_CAPACITY:64}
logging:
  file:
    name: '${ravencoin.data-directory}/logs/rvn-node.log'
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 512MB
