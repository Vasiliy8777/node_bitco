spring:
  application:
    name: ravencoin-node
  main:
    web-application-type: none
ravencoin:
  network: ${RVN_NETWORK:mainnet}
  data-directory: '${RVN_DATA_DIRECTORY:K:/RVNJavaNjde}'
  storage:
    hot-directory: '${RVN_HOT_DIRECTORY:C:/RVNJavaNjde}'
  sync:
    enabled: ${RVN_SYNC_ENABLED:false}
    blocks-enabled: ${RVN_SYNC_BLOCKS:false}
    # Bootstrap peers checked 2026-10-24; DNS seeds remain available afterward.
    # Peer discovery is untrusted: every header/body is independently checked.
    peers: ${RVN_SYNC_PEERS:79.137.67.110,51.79.161.39,5.196.79.95,seed-raven.bitactivate.com,seed-raven.ravencoin.com,seed-raven.ravencoin.org}
    response-timeout-ms: 30000
    poll-ms: 10000
    # Fallback for broken system DNS; only peer addresses, never trusted chain data.
    # An empty RVN_SYNC_DOH disables HTTPS DNS.
    dns-over-https: '${RVN_SYNC_DOH:https://dns.google/resolve}'
  mining:
    # Starts a waiting mining service after CUDA self-tests. Work additionally
    # requires complete historical validation, current chainstate and a live peer.
    # Historical coverage is still incomplete: enabling this cannot bypass it.
    enabled: ${RVN_MINING_ENABLED:false}
    address: ${RVN_MINING_ADDRESS:}
    batch-size: ${RVN_MINING_BATCH_SIZE:4096}
    cuda:
      # Enables the worker and real GPU Core-vector tests. Live work additionally
      # requires mining.enabled and every validation/readiness gate.
      enabled: ${RVN_CUDA_ENABLED:false}
      # Local easy-target block diagnostic; no network submission or mainnet reward.
      job-self-test-enabled: ${RVN_CUDA_JOB_SELF_TEST:false}
      python: ${RVN_CUDA_PYTHON:python}
      worker: '${RVN_CUDA_WORKER:rvn-pow/native/cuda/worker.py}'
      device: ${RVN_CUDA_DEVICE:0}
      reserve-mib: ${RVN_CUDA_RESERVE_MIB:1024}
  validation:
    # Historical native-coin replay only; stops before asset activation.
    # Optional canonical asset replay adds qualifier/restricted rules and atomic
    # undo; unsupported historical formats/expressions stop before tip commit.
    native-replay-enabled: ${RVN_NATIVE_REPLAY:false}
    # Experimental supported-subset replay, NOT complete historical consensus.
    # Requires native replay, header sync and body downloads. Mining stays off.
    canonical-asset-replay-enabled: ${RVN_CANONICAL_ASSET_REPLAY:false}
  pow:
    self-test-enabled: ${RVN_POW_SELF_TEST:false}
    cached-dag-items: 1024
  p2p:
    probe-enabled: ${RVN_P2P_PROBE:false}
    host: ${RVN_P2P_HOST:127.0.0.1}
    port: ${RVN_P2P_PORT:0}
    timeout-ms: 5000
    session-enabled: ${RVN_P2P_SESSION:false}
    session-duration-ms: ${RVN_P2P_SESSION_DURATION_MS:5000}
    queue-capacity: ${RVN_P2P_QUEUE_CAPACITY:64}
logging:
  file:
    name: '${ravencoin.data-directory}/logs/rvn-node.log'
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 512MB
